name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    name: test (py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rnaseq_db
          POSTGRES_USER: rnaseq_user
          POSTGRES_PASSWORD: rnaseq_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rnaseq_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://rnaseq_user:rnaseq_password@localhost:5432/rnaseq_db

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Load base schema
        run: psql "$DATABASE_URL" -f db/init.sql

      - name: Run unit tests (no database)
        run: pytest -m "not integration" -q

      - name: Run full suite (unit + integration)
        run: pytest -q
