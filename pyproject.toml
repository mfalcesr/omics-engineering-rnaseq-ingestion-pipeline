[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rnaseq-ingest"
version = "0.1.0"
description = "RNA-seq vendor payload ingestion pipeline: strict validation, schema evolution, idempotent loads"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6,<3",
    "psycopg[binary]>=3.1,<4",
    "structlog>=24.1",
    "typer>=0.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# The read API is an extra so `pip install rnaseq-ingest` stays lean for CLI-only users.
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg-pool>=3.2",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[project.scripts]
ingest = "rnaseq_ingest.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that require a live PostgreSQL database (deselect with -m 'not integration')",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Pinned explicitly rather than left implicit. These are ruff's own defaults (pyflakes plus
# the pycodestyle errors that matter), but writing them down means a future ruff release
# widening its default set cannot turn CI red without a deliberate change here.
# E501 is intentionally absent: line length is a formatting concern, and `line-length` above
# already governs `ruff format`.
select = ["E4", "E7", "E9", "F"]
