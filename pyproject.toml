[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rnaseq-ingest"
version = "0.1.0"
description = "RNA-seq vendor payload ingestion pipeline: strict validation, schema evolution, idempotent loads"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6,<3",
    "psycopg[binary]>=3.1,<4",
    "structlog>=24.1",
    "typer>=0.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
ingest = "rnaseq_ingest.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that require a live PostgreSQL database (deselect with -m 'not integration')",
]

[tool.ruff]
line-length = 100
target-version = "py310"
